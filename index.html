<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Inside Illness</title>
    <meta name="description" content="Interactive 3D simulations that show what really happens inside the body during common illnesses." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff3b30'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" aria-label="Illnesses">
        <header class="brand">
          <div class="brand-mark"><span></span></div>
          <div>
            <h1>Inside Illness</h1>
            <p>See what happens inside</p>
          </div>
          <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close list"></button>
        </header>
        <label class="search">
          <span class="search-icon"></span>
          <input id="search" type="search" placeholder="Search illnesses" autocomplete="off" />
        </label>
        <nav id="list"></nav>
        <footer class="disclaimer">For learning only — not medical advice.</footer>
      </aside>

      <main id="viewport">
        <div id="canvas-host"></div>

        <div class="hud hud-title">
          <button class="icon-btn glass menu-btn" id="menu-btn" aria-label="Show illness list"></button>
          <div>
            <h2 id="title"></h2>
            <p id="subtitle"></p>
          </div>
        </div>

        <div class="hud hud-controls">
          <div class="segmented glass" id="segmented" role="tablist">
            <span class="seg-thumb"></span>
            <button role="tab" data-v="0">Healthy</button>
            <button role="tab" data-v="1" id="seg-sick">Illness</button>
          </div>
          <div class="slider glass">
            <span>Healthy</span>
            <input type="range" id="progress" min="0" max="1000" value="0" aria-label="How far the illness has progressed" />
            <span>Severe</span>
          </div>
          <div class="readout glass" id="readout">
            <span class="ro-label"></span>
            <span class="ro-value"><b></b><small></small></span>
          </div>
        </div>

        <div class="hud hud-tools glass">
          <button class="icon-btn" id="btn-labels" aria-pressed="true" title="Show labels (L)"></button>
          <button class="icon-btn" id="btn-rotate" aria-pressed="true" title="Auto-rotate (R)"></button>
          <button class="icon-btn" id="btn-reset" title="Reset view"></button>
        </div>

        <section class="hud story glass" id="story" aria-live="polite">
          <div class="story-top">
            <div class="dots" id="dots"></div>
          </div>
          <h3 id="step-title"></h3>
          <p id="step-text"></p>
          <div class="story-nav">
            <button class="icon-btn round" id="prev" aria-label="Previous step"></button>
            <button class="play" id="play"><span class="play-icon"></span><span class="play-label">Play</span></button>
            <button class="icon-btn round" id="next" aria-label="Next step"></button>
          </div>
          <div class="story-progress"><span id="story-bar"></span></div>
        </section>

        <div class="hint" id="hint">Drag to rotate · Scroll to zoom</div>
        <div class="loader" id="loader"><div class="spinner"></div><span>Building 3D model…</span></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
